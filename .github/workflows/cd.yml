name: Deploy Kubernetes Infrastructure

on:
  push:
    branches:
      - homolog
      - main

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Kubernetes infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}

    defaults:
      run:
        working-directory: infra

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      TF_VAR_cluster_role_arn: ${{ secrets.EKS_CLUSTER_ROLE_ARN }}
      TF_VAR_node_role_arn: ${{ secrets.EKS_NODE_ROLE_ARN }}
      TF_VAR_cluster_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Initialize remote state
        run: >-
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=mecanica-k8s/${{ github.ref_name }}/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -input=false

      - name: Create Terraform plan
        run: >-
          terraform plan
          -var="environment=${DEPLOYMENT_ENVIRONMENT}"
          -out=tfplan
          -input=false

      - name: Apply Terraform plan
        run: terraform apply -auto-approve -input=false tfplan
