name: Kubernetes Infrastructure CI

on:
  pull_request:
    branches:
      - homolog
      - main
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Validate Datadog Helm configuration
        working-directory: .
        run: |
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm template datadog-agent datadog/datadog \
            --namespace datadog \
            --values observability/datadog-values.yaml \
            --set-string datadog.clusterName=mecanica-ci \
            --set-string datadog.apiKey=dummy-validation-key \
            > /dev/null
