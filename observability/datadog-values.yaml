datadog:
  site: datadoghq.com
  apiKeyExistingSecret: datadog-secret
  logs:
    enabled: true
    containerCollectAll: false
  apm:
    socketEnabled: true
    portEnabled: false
  processAgent:
    enabled: false
  networkMonitoring:
    enabled: false
  prometheusScrape:
    enabled: true
    serviceEndpoints: true
  collectEvents: false
  kubeStateMetricsEnabled: false
  kubeStateMetricsCore:
    enabled: true
    collectSecretMetrics: false
    collectConfigMaps: false
  tags:
    - project:mecanica
    - managed-by:github-actions

clusterAgent:
  enabled: true
  replicas: 1
  admissionController:
    enabled: true
    mutateUnlabelled: false
    configMode: socket
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

agents:
  containers:
    agent:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
